---
# tasks file for roles/docker

- name: Update apt cache and upgrade system packages
  apt:
    update_cache: yes
    upgrade: dist

- name: Install Git, Docker, and Docker Compose
  apt:
    name:
      - git
      - docker.io
      - docker-compose-v2
    state: present

# Docker network fix: pip/SSL "UNEXPECTED_EOF" errors during image build
# (MTU 1400 + public DNS). Restart happens via handler only if file changes.
- name: Create Docker daemon config (MTU + DNS fix)
  copy:
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
    content: |
      {
        "mtu": 1400,
        "dns": ["8.8.8.8", "1.1.1.1"]
      }
  notify: Restart docker

- name: Ensure Docker service is started and enabled
  service:
    name: docker
    enabled: yes
    state: started

# Apply daemon.json right now (before any image build), not at end of play
- name: Apply pending Docker restart before building
  meta: flush_handlers

- name: Add azureuser to docker group
  user:
    name: azureuser
    groups: docker
    append: yes

# Clone GitHub repository
- name: Clone Nitin-Tushar GitHub Repository
  git:
    repo: "https://github.com/nitin-panwar-6963/RoadGuardAI-Nitin.git"
    dest: /home/azureuser/nitin-tushar-1
    version: main
    force: yes

# Copy backend .env
- name: Copy backend environment file
  copy:
    src: .env
    dest: /home/azureuser/nitin-tushar-1/backend/.env
    owner: azureuser
    group: azureuser
    mode: "0600"

# Copy frontend .env.local
- name: Copy frontend environment file
  copy:
    src: .env.local
    dest: /home/azureuser/nitin-tushar-1/frontend/.env.local
    owner: azureuser
    group: azureuser
    mode: "0600"

# Copy the Caddyfile (HTTPS certificate via nip.io)
- name: Copy Caddy file to system dynamically
  copy:
    src: Caddyfile
    dest: /home/azureuser/nitin-tushar-1/Caddyfile
    mode: "0644"
    group: azureuser
    owner: azureuser

# Build and start Docker containers
- name: Build and start containers using Docker Compose
  command: docker compose up --build -d
  args:
    chdir: /home/azureuser/nitin-tushar-1
